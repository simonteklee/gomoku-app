name: Tester

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installera beroenden
        run: pip install -r backend/requirements.txt pytest httpx
      - name: Kör acceptanstesterna
        run: pytest
