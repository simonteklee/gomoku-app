# SR-02.6: systemet containeriserat med Docker
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gomoku
      POSTGRES_PASSWORD: gomoku
      POSTGRES_DB: gomoku
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gomoku"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://gomoku:gomoku@postgres:5432/gomoku
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
